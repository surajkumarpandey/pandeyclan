<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree — The Pandey Clan of Bairati</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  .tree-toolbar {
    background: var(--paper-light);
    border-bottom: 1px solid var(--line);
    padding: 16px 0;
    position: sticky; top: 0; z-index: 5;
  }
  .tree-toolbar .wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .tree-toolbar input[type=search] { max-width: 320px; }
  .tree-stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 64px - 68px);
    min-height: 560px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 50%, #FFFBF3 0%, var(--paper) 70%);
  }
  #tree-svg { width: 100%; height: 100%; cursor: grab; }
  #tree-svg:active { cursor: grabbing; }

  .gen-ring { fill: none; stroke: var(--ochre); stroke-opacity: 0.10; stroke-width: 1; }
  .gen-ring-label { fill: var(--ochre); opacity: 0.35; font-size: 10px; font-family: var(--font-body); }

  .link { fill: none; stroke: var(--line-dark); stroke-opacity: 0.45; stroke-width: 1.3px; }
  .link.dim { stroke-opacity: 0.12; }

  .node circle.avatar-ring { stroke-width: 2px; cursor: pointer; transition: stroke-width .12s; }
  .node image { cursor: pointer; }
  .node:hover circle.avatar-ring { stroke-width: 3.5px; }
  .node text {
    font-family: var(--font-body); font-size: 10.5px; fill: var(--ink); cursor: pointer;
  }
  .node.placeholder text { fill: #a3826f; font-style: italic; }
  .node.dim { opacity: 0.18; }
  .node.highlight circle.avatar-ring { stroke: var(--gold) !important; stroke-width: 4px; }

  .root-node circle { stroke: var(--gold); stroke-width: 3px; fill: var(--maroon); }
  .root-node text { font-family: var(--font-display); font-weight: 600; font-size: 15px; fill: var(--maroon-deep); }

  .panel {
    position: absolute; top: 0; right: 0; width: 340px; max-width: 88vw; height: 100%;
    background: var(--paper-light); border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(60,20,15,0.12); padding: 24px; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s ease;
  }
  .panel.open { transform: translateX(0); }
  .panel .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); }
  .panel .avatar-lg { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 14px; }
  .panel .avatar-lg-placeholder {
    width: 88px; height: 88px; border-radius: 50%; margin-bottom: 14px;
    background: var(--ochre); opacity: 0.25;
  }
  .panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 4px 0 6px; }
  .panel .chain { font-size: 13px; color: #8a6a58; margin-bottom: 18px; }
  .panel dl { margin: 0; }
  .panel dt { font-size: 12px; font-weight: 600; color: #8a6a58; margin-top: 14px; }
  .panel dd { margin: 3px 0 0; }
  .panel .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .panel .photos img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

  .legend { font-size: 13px; color: #8a6a58; display: flex; gap: 18px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .zoom-controls { display: flex; gap: 6px; margin-left: auto; }
  .zoom-controls button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-dark);
    background: var(--paper-light); color: var(--maroon); font-size: 16px; cursor: pointer;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">The Pandey Clan <em>of Bairati</em></a>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
    <ul class="links">
      <li><a href="index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="tree.html" class="active" data-i18n="nav.tree">Family Tree</a></li>
      <li><a href="map.html" data-i18n="nav.map">Journeys Map</a></li>
      <li><a href="village.html" data-i18n="nav.village">Bairati Village</a></li>
      <li><a href="audit.html" data-i18n="nav.audit">Changelog</a></li>
      <li><a href="admin.html" data-i18n="nav.admin">Edit</a></li>
      <li><button class="lang-toggle" id="lang-toggle">हिंदी</button></li>
    </ul>
  </div>
</nav>

<div class="tree-toolbar">
  <div class="wrap">
    <input type="search" id="search-box" placeholder="Search a name…" aria-label="Search the family tree" data-i18n-placeholder="tree.search.placeholder">
    <span class="legend">
      <span><i style="background:var(--maroon)"></i> <span data-i18n="tree.legend.named">named</span></span>
      <span><i style="background:#E7C9A8"></i> <span data-i18n="tree.legend.placeholder">unnamed / placeholder</span></span>
      <span><i style="background:var(--gold); border-radius:50%;"></i> has a photo</span>
    </span>
    <div class="zoom-controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button id="zoom-reset" aria-label="Reset view" style="width:auto; border-radius:15px; padding:0 10px; font-size:12px;">Reset</button>
    </div>
  </div>
</div>

<div class="tree-stage">
  <svg id="tree-svg"></svg>
  <aside class="panel" id="panel">
    <button class="close-btn" id="panel-close" aria-label="Close">&times;</button>
    <div id="panel-body"></div>
  </aside>
</div>

<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script>
(async function () {
  const people = await PandeyData.loadPeople();

  function buildNode(p) {
    return { id: p.id, data: p, children: people.filter(c => c.parentId === p.id).map(buildNode) };
  }
  const rootPerson = people.find(p => !p.parentId);
  const root = d3.hierarchy(buildNode(rootPerson), d => d.children);
  const maxDepth = d3.max(root.descendants(), d => d.depth);

  const DR = 92; // px per generation ring
  const radius = maxDepth * DR;

  const treeLayout = d3.tree()
    .size([2 * Math.PI, radius])
    .separation((a, b) => (a.parent === b.parent ? 1.1 : 2.4) / a.depth || 1);
  treeLayout(root);

  const svg = d3.select('#tree-svg');
  const g = svg.append('g');

  // ---------- Generation guide rings (the "mandala" backdrop) ----------
  const ringsLayer = g.append('g').attr('class', 'rings-layer');
  for (let gen = 1; gen <= maxDepth; gen++) {
    ringsLayer.append('circle').attr('class', 'gen-ring').attr('r', gen * DR);
  }
  ringsLayer.append('text').attr('class', 'gen-ring-label').attr('x', 4).attr('y', -maxDepth * DR + 12)
    .text(`${maxDepth} generations out`);

  // ---------- Links ----------
  const linkGen = d3.linkRadial().angle(d => d.x).radius(d => d.y);
  const linksLayer = g.append('g').attr('class', 'links-layer');
  const linkSel = linksLayer.selectAll('path.link')
    .data(root.links())
    .join('path')
    .attr('class', 'link')
    .attr('d', linkGen);

  // ---------- Nodes ----------
  const AVATAR_R = 9;
  const ROOT_R = 24;

  const nodesLayer = g.append('g').attr('class', 'nodes-layer');
  const nodeSel = nodesLayer.selectAll('g.node')
    .data(root.descendants())
    .join('g')
    .attr('class', d => 'node' + (d.data.data.unnamedPlaceholder ? ' placeholder' : '') + (d.depth === 0 ? ' root-node' : ''))
    .attr('transform', d => d.depth === 0 ? 'translate(0,0)' : `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

  nodeSel.each(function (d) {
    const sel = d3.select(this);
    const p = d.data.data;
    const r = d.depth === 0 ? ROOT_R : AVATAR_R;
    const hasPhoto = p.photos && p.photos.length;
    const ringColor = p.unnamedPlaceholder ? '#C9A98A' : (hasPhoto ? 'var(--gold)' : 'var(--maroon)');

    if (hasPhoto) {
      const clipId = 'clip-' + d.data.id;
      sel.append('clipPath').attr('id', clipId).append('circle').attr('r', r);
      sel.append('image')
        .attr('href', p.photos[0])
        .attr('x', -r).attr('y', -r).attr('width', r * 2).attr('height', r * 2)
        .attr('clip-path', `url(#${clipId})`)
        .attr('preserveAspectRatio', 'xMidYMid slice');
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r).attr('fill', 'none').attr('stroke', ringColor);
    } else {
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r)
        .attr('fill', d.depth === 0 ? 'var(--maroon)' : '#FFFBF3')
        .attr('stroke', ringColor);
    }

    const label = sel.append('text')
      .text(PandeyData.displayName(p))
      .attr('dy', '0.32em');

    if (d.depth === 0) {
      label.attr('x', 0).attr('y', r + 16).attr('text-anchor', 'middle');
    } else if (d.x < Math.PI) {
      label.attr('x', r + 6).attr('text-anchor', 'start');
    } else {
      label.attr('x', -(r + 6)).attr('text-anchor', 'end').attr('transform', 'rotate(180)');
    }
  });

  nodeSel.on('click', (event, d) => { event.stopPropagation(); openPanel(d.data.data); });

  // ---------- Zoom / pan ----------
  const zoom = d3.zoom().scaleExtent([0.15, 3]).on('zoom', (event) => g.attr('transform', event.transform));
  svg.call(zoom);
  const stage = document.querySelector('.tree-stage');

  function fitView(duration = 0) {
    const scale = Math.min(1, (Math.min(stage.clientWidth, stage.clientHeight) * 0.92) / (radius * 2));
    const t = d3.zoomIdentity.translate(stage.clientWidth / 2, stage.clientHeight / 2).scale(scale);
    (duration ? svg.transition().duration(duration) : svg).call(zoom.transform, t);
  }
  requestAnimationFrame(() => fitView());

  document.getElementById('zoom-in').addEventListener('click', () => svg.transition().duration(150).call(zoom.scaleBy, 1.3));
  document.getElementById('zoom-out').addEventListener('click', () => svg.transition().duration(150).call(zoom.scaleBy, 1 / 1.3));
  document.getElementById('zoom-reset').addEventListener('click', () => fitView(300));

  // ---------- Detail panel ----------
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  document.getElementById('panel-close').addEventListener('click', () => panel.classList.remove('open'));

  function openPanel(p) {
    const chain = PandeyData.ancestorChain(people, p.id).map(n => PandeyData.displayName(n)).join(' → ');
    const photos = (p.photos || []).map(src => `<img src="${src}" alt="">`).join('');
    const avatarHtml = (p.photos && p.photos.length)
      ? `<img class="avatar-lg" src="${p.photos[0]}" alt="">`
      : `<div class="avatar-lg-placeholder"></div>`;
    const current = (p.locations || []).find(l => l.type === 'current');
    const others = (p.locations || []).filter(l => l.type !== 'current' && l.type !== 'origin');
    const othersStr = others.map(l => `${l.place}${l.type ? ' (' + l.type + (l.year ? ', ' + l.year : '') + ')' : ''}`).join(', ');
    panelBody.innerHTML = `
      ${avatarHtml}
      <h2>${PandeyData.displayName(p)}</h2>
      <div class="chain">${chain}</div>
      ${p.unnamedPlaceholder ? '<span class="badge badge-placeholder">Name not recorded</span>' : ''}
      <dl>
        ${p.occupation ? `<dt>Occupation</dt><dd>${p.occupation}</dd>` : ''}
        ${p.birthYear ? `<dt>Born</dt><dd>${p.birthYear}</dd>` : ''}
        ${current ? `<dt>Current location</dt><dd>${current.place}</dd>` : ''}
        ${othersStr ? `<dt>Other places</dt><dd>${othersStr}</dd>` : ''}
        ${p.bio ? `<dt>Notes</dt><dd>${p.bio}</dd>` : ''}
        ${p.notes ? `<dt>Chart notes</dt><dd class="muted">${p.notes}</dd>` : ''}
      </dl>
      ${photos ? `<dt style="font-size:12px;font-weight:600;color:#8a6a58;margin-top:14px;">Photos</dt><div class="photos">${photos}</div>` : ''}
      <p style="margin-top:22px; display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn btn-outline-dark btn-sm" href="admin.html?person=${p.id}">Add details</a>
        ${(p.locations || []).length ? `<a class="btn btn-outline-dark btn-sm" href="map.html?person=${p.id}">See their journey</a>` : ''}
      </p>
    `;
    panel.classList.add('open');
  }

  // ---------- Search: dim everything except the ancestor path to the match ----------
  document.getElementById('search-box').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    nodeSel.classed('highlight', false).classed('dim', false);
    linkSel.classed('dim', false);
    if (!q) return;

    const match = root.descendants().find(d => !d.data.data.unnamedPlaceholder && d.data.data.name.toLowerCase().includes(q));
    if (!match) return;

    const ancestorIds = new Set();
    let n = match;
    while (n) { ancestorIds.add(n.data.id); n = n.parent; }

    nodeSel.classed('dim', d => !ancestorIds.has(d.data.id));
    linkSel.classed('dim', d => !ancestorIds.has(d.target.data.id));
    nodeSel.filter(d => d.data.id === match.data.id).classed('highlight', true);

    const angle = match.x, r = match.y;
    const px = r * Math.sin(angle), py = -r * Math.cos(angle);
    const scale = 1;
    const t = d3.zoomIdentity.translate(stage.clientWidth / 2 - px * scale, stage.clientHeight / 2 - py * scale).scale(scale);
    svg.transition().duration(350).call(zoom.transform, t);
  });
})();
</script>
</body>
</html>
