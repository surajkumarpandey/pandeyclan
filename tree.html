<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree — The Pandey Clan of Bairati</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  .tree-toolbar {
    background: var(--paper-light);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    position: sticky; top: 0; z-index: 6;
  }
  .tree-toolbar .wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .tree-toolbar input[type=search] { max-width: 300px; }
  .zoom-controls { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .zoom-controls button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-dark);
    background: var(--paper-light); color: var(--maroon); font-size: 16px; cursor: pointer; font-weight: 700;
  }
  .zoom-controls button:hover { background: var(--maroon); color: var(--paper-light); }

  .tree-body { display: block; }
  .story-sidebar, .gen-rail, .gen-label-tag { display: none !important; }
  .story-sidebar {
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    padding: 28px 22px;
    border-left: 1px solid var(--line);
    background: var(--paper-light);
  }
  .story-sidebar .gen-num { font-family: var(--font-display); font-size: 13px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .story-sidebar h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0 0 12px; }
  .story-sidebar p { font-size: 14.5px; color: #5a3a2e; line-height: 1.6; }
  .story-sidebar .empty { color: #a3826f; font-style: italic; font-size: 14px; }
  .story-sidebar .story-photos { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .story-sidebar .story-photos img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

  .tree-scroll-wrap {
    overflow-x: auto;
    overflow-y: hidden;              /* otherwise browsers make this a vertical scroll box too, trapping swipes on phones */
    touch-action: pan-x pan-y;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    background-image: url('assets/img/tree-backdrop.jpg');
    background-repeat: repeat;
    background-size: 620px auto;
    background-color: var(--paper);
  }
  .tree-canvas { position: relative; transform-origin: top left; }
  #tree-zoom-sizer { position: relative; }

  /* one soft band per generation, behind its row of people; it lives inside the
     zoomed canvas, so it stays behind the right members at every zoom level */
  .gen-marker { position: absolute; left: 0; width: 100%; pointer-events: none; z-index: 0;
    border-top: 1px solid rgba(179,64,42,0.10); }
  .gen-marker.band-a { background: linear-gradient(180deg, rgba(224,149,42,0.16), rgba(224,149,42,0.07)); }
  .gen-marker.band-b { background: linear-gradient(180deg, rgba(92,31,39,0.07), rgba(92,31,39,0.025)); }
  .gen-marker .band-num { position: absolute; left: 12px; top: 8px; font-family: var(--font-display); font-size: 13px;
    font-weight: 700; color: var(--maroon-deep); opacity: 0.45; }
  #tree-svg { position: relative; z-index: 1; }
  .gen-label-tag {
    position: absolute; left: 14px;
    font-family: var(--font-display); font-size: 13px; font-weight: 700;
    color: var(--maroon-deep); opacity: 0.9; letter-spacing: 0.3px;
    background: rgba(255,251,243,0.82); padding: 2px 9px; border-radius: 999px;
  }

  .link {
    fill: none; stroke: var(--gold); stroke-opacity: 0.95; stroke-width: 2.4px; stroke-linejoin: miter;
    filter: drop-shadow(0 0 3px rgba(224,149,42,0.9)) drop-shadow(0 0 7px rgba(224,149,42,0.5));
  }
  .link.dim { stroke-opacity: 0.1; filter: none; }

  .sun-halo { fill: var(--gold); opacity: 0.28; pointer-events: none; }
  .sun-halo.root-halo { opacity: 0.4; }

  .node circle.avatar-ring {
    stroke-width: 3px; cursor: pointer; transition: stroke-width .12s;
    filter: drop-shadow(0 0 4px rgba(224,149,42,0.7)) drop-shadow(0 1px 4px rgba(46,15,10,0.4));
  }
  .node image { cursor: pointer; }
  .node:hover circle.avatar-ring { stroke-width: 4.5px; }
  .node text {
    font-family: var(--font-body); font-size: 11px; font-weight: 600; fill: var(--ink); cursor: pointer; text-anchor: middle;
    paint-order: stroke fill; stroke: #FFFBF3; stroke-width: 3.5px; stroke-linejoin: round;
  }
  .node.placeholder text { fill: #7a4a30; }
  .node.dim { opacity: 0.15; }
  .node.dim .sun-halo { opacity: 0.05; }
  .node.highlight circle.avatar-ring { stroke: var(--gold) !important; stroke-width: 4px; }

  .root-node circle.avatar-ring { stroke: var(--gold); stroke-width: 3.5px; }
  .root-node text { font-family: var(--font-display); font-weight: 600; font-size: 13px; fill: var(--maroon-deep); }

  .panel {
    position: fixed; top: 0; right: 0; width: 340px; max-width: 88vw; height: 100%;
    background: var(--paper-light); border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(60,20,15,0.12); padding: 24px; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s ease; z-index: 20;
  }
  .panel.open { transform: translateX(0); }
  .panel .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); }
  .panel .avatar-lg { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 14px; }
  .panel .avatar-lg-placeholder { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 14px; background: var(--ochre); opacity: 0.25; }
  .panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 4px 0 6px; }
  .panel .rel-block { margin: 0 0 12px; }
  .panel .rel-key { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ochre-deep); margin-bottom: 2px; }
  .panel .rel-name { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.35; }
  .panel .rel-of { font-size: 14.5px; color: #5a3a2e; line-height: 1.45; }
  .panel .chain { font-size: 13px; color: #8a6a58; margin: 2px 0 18px; line-height: 1.5; }
  .panel dl { margin: 0; }
  .panel dt { font-size: 12px; font-weight: 600; color: #8a6a58; margin-top: 14px; }
  .panel dd { margin: 3px 0 0; }
  .panel .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .panel .photos img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

  /* expand / collapse control on nodes that have children */
  .node .toggle { cursor: pointer; }
  .node .toggle circle { fill: var(--maroon); stroke: #FFFBF3; stroke-width: 2px; }
  .node .toggle text { fill: #FFFBF3; stroke: none; font-size: 15px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .node .toggle .count { fill: var(--maroon); font-size: 11px; font-weight: 700; text-anchor: start; paint-order: stroke fill; stroke: #FFFBF3; stroke-width: 3px; }

  /* generation rail: pinned to the left edge on phones, never scrolls sideways */
  .tree-area { position: relative; min-width: 0; }
  .gen-rail { display: none; position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 4; pointer-events: none; }
  .gen-card {
    position: absolute; left: 4px; width: 92px; pointer-events: auto; cursor: pointer;
    background: rgba(255,251,243,0.94); border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: 6px; padding: 5px 7px; box-shadow: 0 2px 8px rgba(62,18,24,0.15); overflow: hidden;
  }
  .gen-card .gc-num { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; color: var(--maroon-deep); line-height: 1.2; }
  .gen-card .gc-range { font-size: 10.5px; color: #8a6a58; line-height: 1.25; }
  .gen-card .gc-more { font-size: 10.5px; color: var(--ochre-deep); font-weight: 700; margin-top: 2px; }
  .gen-card .gc-body { display: none; font-size: 13.5px; color: #5a3a2e; line-height: 1.55; margin-top: 6px; }
  .gen-card .gc-body p { margin: 0 0 8px; }
  .gen-card .gc-body img { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; margin: 0 6px 6px 0; }
  .gen-card.open { width: min(330px, 86vw); max-height: none !important; z-index: 6; box-shadow: 0 8px 24px rgba(62,18,24,0.3); }
  .gen-card.open .gc-body { display: block; }
  .gen-card.open .gc-more { display: none; }

  @media (max-width: 800px) {
    .tree-body { grid-template-columns: 1fr; }
  }

  @media print {
    .site-nav, .tree-toolbar, .story-sidebar, .panel { display: none !important; }
    .tree-body { display: block; }
    .tree-scroll-wrap { overflow: visible !important; background-image: none !important; }
    #tree-zoom-sizer { width: auto !important; height: auto !important; }
    /* transform is set dynamically by JS just before printing, to fit the
       page width exactly — see the beforeprint handler below */
    body { background: #fff; }
    .gen-label-tag { background: none; }
    @page { size: landscape; margin: 8mm; }
  }
</style>
</head>

<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script>
(async function () {
  let people, generations;
  try {
    [people, generations] = await Promise.all([
      PandeyData.loadPeople(),
      fetch('data/generations.json?_=' + Date.now()).then(r => r.json()).catch(() => [])
    ]);
  } catch (e) {
    showFatalError('Could not load the family tree: ' + e.message);
    return;
  }
  const genById = {};
  generations.forEach(g => { genById[g.generation] = g; });

  // ---------- Tree structure (with collapsible branches) ----------
  const collapsed = new Set();              // ids of people whose children are hidden
  const sortKids = (list) => list.sort((a, b) => (a.sortOrder ?? 9999) - (b.sortOrder ?? 9999) || PandeyData.displayName(a).localeCompare(PandeyData.displayName(b)));
  const kidsOf = (id) => sortKids(people.filter(c => c.parentId === id));
  function countDescendants(id) { return kidsOf(id).reduce((n, k) => n + 1 + countDescendants(k.id), 0); }
  function buildNode(p) {
    const kids = kidsOf(p.id), isCollapsed = kids.length > 0 && collapsed.has(p.id);
    return { id: p.id, data: p, hasKids: kids.length > 0, isCollapsed, children: isCollapsed ? [] : kids.map(buildNode) };
  }
  // the root is the ancestor with no parent who isn't simply someone's spouse
  const rootPerson = people.find(p => !p.parentId && !people.some(x => x.spouseId === p.id && x.parentId)) || people.find(p => !p.parentId);
  const fullMaxDepth = d3.max(d3.hierarchy(buildNode(rootPerson), d => d.children).descendants(), d => d.depth);

  const DX = 120;  // horizontal spacing between siblings — wide enough for bigger avatars + labels
  const DY = 168;  // vertical spacing between generations
  const MARGIN_TOP = 60, MARGIN_SIDE = 60;
  const R = 20, ROOT_R = 34;
  const spouseGap = Math.max(DX * 0.62, R * 2.6);
  const isMobile = () => window.matchMedia('(max-width: 800px)').matches;
  const RAIL_W = 100;                      // space reserved on the left for the generation rail on phones

  const canvas = document.getElementById('tree-canvas');
  const sizer = document.getElementById('tree-zoom-sizer');
  const scrollWrap = document.getElementById('tree-scroll-wrap');
  const svgSel = d3.select('#tree-svg');
  const totalHeight = fullMaxDepth * DY + MARGIN_TOP * 2;
  canvas.style.height = totalHeight + 'px';
  let root, totalWidth, offsetX, nodeSel, linkSel, spouseLayer, spouseRenderList, zoomLevel = null;

  // ---------- Generation bands: a shaded row behind each generation ----------
  for (let gen = 1; gen <= fullMaxDepth + 1; gen++) {
    const nodeY = (gen - 1) * DY + MARGIN_TOP;
    const band = document.createElement('div');
    band.className = 'gen-marker ' + (gen % 2 ? 'band-a' : 'band-b'); band.dataset.gen = gen;
    band.style.top = (nodeY - 48) + 'px'; band.style.height = DY + 'px';
    band.innerHTML = `<span class="band-num">${gen}</span>`;
    canvas.appendChild(band);
  }

  // Generation headings show the number only. The date ranges that used to
  // appear here were early estimates, not family records, so they are hidden,
  // along with the note that explained how they were estimated.
  function genTitle(gen) {
    const t = (genById[gen] && genById[gen].title) || '';
    return t.split(' \u2014 ')[0].trim() || `Generation ${gen}`;
  }
  function storyText(desc) {
    const cleaned = desc.replace(/\n*\(Dates are estimated[^)]*\)\s*$/, '').trim();
    return fillStoryTokens(cleaned);
  }

  // ---------- Generation rail (phones): one card per generation, pinned left ----------
  const rail = document.getElementById('gen-rail');
  function railCardHTML(gen) {
    const story = genById[gen] || {};
    const parts = (story.title || `Generation ${gen}`).split(' — ');
    const range = parts[1] || '';
    const photos = story.photos && story.photos.length ? story.photos.map(src => `<img src="${src}" alt="">`).join('') : '';
    const body = story.description
      ? storyText(story.description).split('\n\n').map(p => `<p>${p}</p>`).join('')
      : `<p><em>${PandeyI18n.t('tree.sidebar.empty', 'No story added for this generation yet.')}</em></p>`;
    return `<div class="gc-num">Gen ${gen}</div><div class="gc-more">Read ▸</div><div class="gc-body">${photos ? `<div>${photos}</div>` : ''}${body}</div>`;
  }
  function buildRail() {
    rail.innerHTML = '';
    for (let gen = 1; gen <= fullMaxDepth + 1; gen++) {
      const card = document.createElement('div');
      card.className = 'gen-card'; card.dataset.gen = gen;
      card.innerHTML = railCardHTML(gen);
      card.addEventListener('click', () => {
        const wasOpen = card.classList.contains('open');
        rail.querySelectorAll('.gen-card.open').forEach(c => c.classList.remove('open'));
        if (!wasOpen) card.classList.add('open');
      });
      rail.appendChild(card);
    }
    positionRail();
  }
  function positionRail() {
    if (zoomLevel == null) return;
    const rowH = DY * zoomLevel;
    rail.querySelectorAll('.gen-card').forEach(card => {
      const gen = +card.dataset.gen;
      const nodeY = ((gen - 1) * DY + MARGIN_TOP) * zoomLevel;
      card.style.top = Math.max(0, nodeY - Math.min(rowH * 0.45, 40)) + 'px';
      card.style.maxHeight = Math.max(38, rowH - 6) + 'px';
    });
  }

  // ---------- Zoom ----------
  // The canvas is visually scaled with a CSS transform; the sizer div around
  // it is set to the SCALED dimensions so the scrollbars match what's visible.
  function applyZoom() {
    canvas.style.transform = `scale(${zoomLevel})`;
    sizer.style.width = (totalWidth * zoomLevel) + 'px';
    sizer.style.height = (totalHeight * zoomLevel) + 'px';
    sizer.style.marginLeft = '0';
  }
  const defaultZoom = () => Math.max(0.3, Math.min(1, (scrollWrap.clientWidth * 2.4) / totalWidth));
  document.getElementById('zoom-in-btn').addEventListener('click', () => { zoomLevel = Math.min(1.4, zoomLevel + 0.15); applyZoom(); });
  document.getElementById('zoom-out-btn').addEventListener('click', () => { zoomLevel = Math.max(0.2, zoomLevel - 0.15); applyZoom(); });
  document.getElementById('zoom-reset-btn').addEventListener('click', () => { zoomLevel = defaultZoom(); applyZoom(); });
  window.addEventListener('resize', applyZoom);

  // ---------- Drawing helpers ----------
  // A wavy, sun-ray halo behind each avatar, evoking Indian sun/mandala iconography.
  function sunHaloPath(r, rays, amp) {
    const steps = rays * 6; let d = '';
    for (let i = 0; i <= steps; i++) {
      const angle = (i / steps) * Math.PI * 2, rr = r + Math.sin(angle * rays) * amp;
      d += (i === 0 ? 'M' : 'L') + (rr * Math.cos(angle)).toFixed(1) + ',' + (rr * Math.sin(angle)).toFixed(1);
    }
    return d + 'Z';
  }
  // Wraps a label onto multiple lines so long names don't run into neighbours.
  function wrapLabel(textSel, maxWidth, lineHeightEm) {
    const words = textSel.text().split(/\s+/).reverse();
    let word, line = [], lineNumber = 0;
    const y = textSel.attr('y');
    textSel.text(null);
    let tspan = textSel.append('tspan').attr('x', 0).attr('y', y);
    while ((word = words.pop())) {
      line.push(word); tspan.text(line.join(' '));
      if (tspan.node().getComputedTextLength() > maxWidth && line.length > 1) {
        line.pop(); tspan.text(line.join(' ')); line = [word]; lineNumber++;
        tspan = textSel.append('tspan').attr('x', 0).attr('y', y).attr('dy', lineNumber * lineHeightEm + 'em').text(word);
      }
    }
  }
  function drawAvatar(sel, p, r, isRoot) {
    const hasPhoto = p.photos && p.photos.length;
    const ringColor = p.unnamedPlaceholder ? '#B8804A' : (hasPhoto ? 'var(--gold)' : 'var(--maroon)');
    sel.append('path').attr('class', 'sun-halo' + (isRoot ? ' root-halo' : '')).attr('d', sunHaloPath(r * 1.35, isRoot ? 16 : 10, r * 0.22));
    if (hasPhoto) {
      const clipId = 'clip-' + p.id + '-' + Math.random().toString(36).slice(2, 6);
      sel.append('clipPath').attr('id', clipId).append('circle').attr('r', r);
      sel.append('image').attr('href', p.photos[0]).attr('x', -r).attr('y', -r).attr('width', r * 2).attr('height', r * 2)
        .attr('clip-path', `url(#${clipId})`).attr('preserveAspectRatio', 'xMidYMid slice');
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r).attr('fill', 'none').attr('stroke', ringColor);
    } else {
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r).attr('fill', isRoot ? 'var(--maroon)' : '#FFFBF3').attr('stroke', ringColor);
    }
    const label = sel.append('text').text(PandeyData.displayName(p)).attr('y', r + 15);
    wrapLabel(label, DX - 14, 1.15);
  }

  // ---------- Draw (re-run whenever a branch is expanded or collapsed) ----------
  function draw() {
    root = d3.hierarchy(buildNode(rootPerson), d => d.children);
    d3.tree().nodeSize([DX, DY])(root);
    let minX = Infinity, maxX = -Infinity;
    root.each(d => { minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x); });
    totalWidth = (maxX - minX) + MARGIN_SIDE * 2 + 200;   // extra room for spouses drawn beside their partner
    offsetX = -minX + MARGIN_SIDE;
    canvas.style.width = totalWidth + 'px';
    svgSel.attr('width', totalWidth).attr('height', totalHeight);
    svgSel.selectAll('*').remove();
    const g = svgSel.append('g').attr('transform', `translate(${offsetX},${MARGIN_TOP})`);

    // children hang from the midpoint of a couple where a spouse is recorded
    const midXMap = new Map();
    spouseRenderList = [];
    root.each(d => {
      const p = d.data.data;
      if (p.spouseId) {
        const spouse = people.find(x => x.id === p.spouseId);
        if (spouse && spouse.parentId === null) {
          const spouseX = d.x + spouseGap;
          midXMap.set(d.data.id, (d.x + spouseX) / 2);
          spouseRenderList.push({ person: spouse, x: spouseX, y: d.y, partnerX: d.x, partnerY: d.y });
        }
      }
    });
    // right-angled (elbow) connectors
    const elbowLink = (d) => {
      const sx = midXMap.has(d.source.data.id) ? midXMap.get(d.source.data.id) : d.source.x;
      const midY = (d.source.y + d.target.y) / 2;
      return `M${sx},${d.source.y} V${midY} H${d.target.x} V${d.target.y}`;
    };
    linkSel = g.append('g').attr('class', 'links-layer').selectAll('path.link').data(root.links()).join('path').attr('class', 'link').attr('d', elbowLink);

    nodeSel = g.append('g').attr('class', 'nodes-layer').selectAll('g.node').data(root.descendants()).join('g')
      .attr('class', d => 'node' + (d.data.data.unnamedPlaceholder ? ' placeholder' : '') + (d.depth === 0 ? ' root-node' : ''))
      .attr('transform', d => `translate(${d.x},${d.y})`);
    nodeSel.each(function (d) { drawAvatar(d3.select(this), d.data.data, d.depth === 0 ? ROOT_R : R, d.depth === 0); });

    // expand / collapse button on everyone who has children
    nodeSel.filter(d => d.data.hasKids).each(function (d) {
      const r = d.depth === 0 ? ROOT_R : R;
      const tg = d3.select(this).append('g').attr('class', 'toggle')
        .attr('transform', `translate(${r * 0.95},${-r * 0.95})`)
        .attr('aria-label', d.data.isCollapsed ? 'Expand' : 'Collapse')
        .on('click', (event) => { event.stopPropagation(); toggleBranch(d.data.id); });
      tg.append('circle').attr('r', 11);
      tg.append('text').attr('dy', '0.36em').text(d.data.isCollapsed ? '+' : '−');
      if (d.data.isCollapsed) tg.append('text').attr('class', 'count').attr('x', 15).attr('dy', '0.36em').text(`${countDescendants(d.data.id)} more`);
    });

    // spouses beside their partner, joined by a marriage line
    spouseLayer = g.append('g').attr('class', 'spouse-layer');
    spouseRenderList.forEach(({ person, x, y, partnerX, partnerY }) => {
      spouseLayer.append('line').attr('class', 'link').attr('x1', partnerX).attr('y1', partnerY).attr('x2', x).attr('y2', y);
      const sSel = spouseLayer.append('g').attr('class', 'node' + (person.unnamedPlaceholder ? ' placeholder' : ''))
        .attr('transform', `translate(${x},${y})`).style('cursor', 'pointer')
        .on('click', (event) => { event.stopPropagation(); openPanel(person); });
      drawAvatar(sSel, person, R, false);
    });

    nodeSel.on('click', (event, d) => { event.stopPropagation(); openPanel(d.data.data); });
    if (zoomLevel == null) zoomLevel = defaultZoom();
    applyZoom();
  }

  const nodeX = (id) => { let x = null; root.each(d => { if (d.data.id === id) x = d.x + offsetX; }); return x; };
  function toggleBranch(id) {
    const before = nodeX(id);
    if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
    draw();
    // keep the node that was tapped in the same place on screen
    const after = nodeX(id);
    if (before != null && after != null) scrollWrap.scrollLeft += (after - before) * zoomLevel;
  }
  document.getElementById('expand-all-btn').addEventListener('click', () => { collapsed.clear(); draw(); });
  document.getElementById('collapse-all-btn').addEventListener('click', () => {
    collapsed.clear();
    kidsOf(rootPerson.id).forEach(k => { if (kidsOf(k.id).length) collapsed.add(k.id); });
    draw();
    scrollWrap.scrollLeft = Math.max(0, (nodeX(rootPerson.id) - 60) * zoomLevel);
  });

  // Story text can contain {{children:PERSON_ID}}, which is filled in live
  // from the tree data — e.g. "shared by {{children:laxmidutt}}".
  function fillStoryTokens(text) {
    return text.replace(/\{\{children:([a-zA-Z0-9_-]+)\}\}/g, (match, id) => {
      const kids = kidsOf(id).map(x => PandeyData.displayName(x));
      if (!kids.length) return 'his children';
      if (kids.length === 1) return kids[0];
      return kids.slice(0, -1).join(', ') + ' and ' + kids[kids.length - 1];
    });
  }

  draw();
  requestAnimationFrame(() => { scrollWrap.scrollLeft = Math.max(0, (offsetX - 60) * zoomLevel); });

  // ---------- Sticky generation story, driven by scroll position ----------
  const sidebar = document.getElementById('story-sidebar');
  function renderStory(gen) {
    const story = genById[gen];
    const photos = story && story.photos && story.photos.length
      ? `<div class="story-photos">${story.photos.map(src => `<img src="${src}">`).join('')}</div>` : '';
    sidebar.innerHTML = `
      <div class="gen-num">GENERATION ${gen}</div>
      <h2>${genTitle(gen)}</h2>
      ${photos}
      ${story && story.description ? storyText(story.description).split('\n\n').map(para => `<p>${para}</p>`).join('') : `<p class="empty">${PandeyI18n.t('tree.sidebar.empty', 'No story added for this generation yet.')}</p>`}
    `;
  }
  // ---------- Detail panel ----------
  const panel = document.getElementById('panel');
  let currentPanelPersonId = null;
  const panelBody = document.getElementById('panel-body');
  document.getElementById('panel-close').addEventListener('click', () => { panel.classList.remove('open'); currentPanelPersonId = null; });

  function formatBirthDate(birthDate, birthYearFallback) {
    if (!birthDate) return birthYearFallback || '';
    const d = new Date(birthDate + 'T00:00:00');
    if (isNaN(d)) return birthDate;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ---------- Relationship sentences for the detail panel ----------
  // e.g. "Suraj Kumar Pandey, son of Ashok Kumar Pandey and Hemlata Pandey"
  //      "Husband of Hemlata Pandey, daughter of … and …"
  const fullNameOf = (x) => x.unnamedPlaceholder ? PandeyData.displayName(x) : (x.fullName || x.name);
  // stand-in names such as "Spouse nitya" or "PremaSpouse" aren't real names — leave them out of sentences
  const isRealName = (n) => !!n && !/spouse/i.test(n) && !/not recorded/i.test(n);
  function parentNamesOf(x) {
    // The parent in the tree plus that parent's spouse; for someone who married
    // into the family, the father's/mother's names typed on their own record.
    const parent = x.parentId ? people.find(q => q.id === x.parentId) : null;
    const parentSpouse = parent && parent.spouseId ? people.find(q => q.id === parent.spouseId) : null;
    let father = null, mother = null;
    if (parent) {
      if (parent.gender === 'F') { mother = fullNameOf(parent); father = parentSpouse ? fullNameOf(parentSpouse) : x.fatherName; }
      else { father = fullNameOf(parent); mother = parentSpouse ? fullNameOf(parentSpouse) : x.motherName; }
    } else {
      father = x.fatherName; mother = x.motherName;
    }
    return [father, mother].filter(isRealName);
  }
  function relationLines(p) {
    // Layout:            Dr. Suraj Kumar Pandey
    //                    Son of Ashok Kumar Pandey and Hemlata Pant
    //                    SPOUSE
    //                    Vibha Pandey
    //                    Daughter of Shashikant Dixit and Suman Dixit
    const hi = PandeyI18n.currentLang() !== 'en';
    const joinAnd = (names) => names.join(hi ? ' एवं ' : ' and ');
    const ofLine = (g, names) => hi
      ? `${joinAnd(names)} ${g === 'M' ? 'के पुत्र' : g === 'F' ? 'की पुत्री' : 'की संतान'}`
      : `${g === 'M' ? 'Son of' : g === 'F' ? 'Daughter of' : 'Child of'} ${joinAnd(names)}`;
    let html = `<div class="rel-block"><div class="rel-name">${fullNameOf(p)}</div>`;
    const parents = parentNamesOf(p);
    if (parents.length) html += `<div class="rel-of">${ofLine(p.gender, parents)}</div>`;
    html += '</div>';
    const spouse = p.spouseId ? people.find(x => x.id === p.spouseId) : null;
    if (spouse) {
      html += `<div class="rel-block"><div class="rel-key">${hi ? 'जीवनसाथी' : 'Spouse'}</div>`;
      if (!isRealName(fullNameOf(spouse))) {
        html += `<div class="rel-name muted">${hi ? 'नाम दर्ज नहीं' : 'Name not recorded'}</div>`;
      } else {
        html += `<div class="rel-name">${fullNameOf(spouse)}</div>`;
        const spParents = parentNamesOf(spouse);
        if (spParents.length) html += `<div class="rel-of">${ofLine(spouse.gender, spParents)}</div>`;
      }
      html += '</div>';
    }
    return html;
  }

  function openPanel(p) {
    const t = PandeyI18n.t;
    const audioList = p.audioMessages || (p.audioMessage ? [p.audioMessage] : []);
    const chain = PandeyData.ancestorChain(people, p.id).map(n => PandeyData.displayName(n)).join(' → ');
    const photos = (p.photos || []).map(src => `<img src="${src}" alt="">`).join('');
    const avatarHtml = (p.photos && p.photos.length) ? `<img class="avatar-lg" src="${p.photos[0]}" alt="">` : `<div class="avatar-lg-placeholder"></div>`;
    const current = (p.locations || []).find(l => l.type === 'current');
    const others = (p.locations || []).filter(l => l.type !== 'current' && l.type !== 'origin');
    const othersStr = others.map(l => `${l.place}${l.year ? ' (' + l.year + ')' : ''}`).join(', ');
    const spouse = p.spouseId ? people.find(x => x.id === p.spouseId) : null;
    panelBody.innerHTML = `
      ${avatarHtml}
      <h2>${PandeyData.displayName(p)}</h2>
      ${relationLines(p)}
      ${chain ? `<div class="rel-key">${t('tree.field.lineage', 'Lineage')}</div><div class="chain">${chain}</div>` : ''}
      ${p.unnamedPlaceholder ? `<span class="badge badge-placeholder">${t('tree.field.namenotrecorded', 'Name not recorded')}</span>` : ''}
      <dl>
        ${p.occupation ? `<dt>${t('tree.field.occupation', 'Occupation')}</dt><dd>${p.occupation}</dd>` : ''}
        ${(p.birthDate || p.birthYear) ? `<dt>${t('tree.field.born', 'Born')}</dt><dd>${formatBirthDate(p.birthDate, p.birthYear)}${p.birthPlace ? ', ' + p.birthPlace : ''}</dd>` : (p.birthPlace ? `<dt>${t('tree.field.born', 'Born')}</dt><dd>${p.birthPlace}</dd>` : '')}
        ${current ? `<dt>${t('tree.field.currentlocation', 'Current location')}</dt><dd>${current.place}</dd>` : ''}
        ${othersStr ? `<dt>${t('tree.field.placesvisited', 'Places visited')}</dt><dd>${othersStr}</dd>` : ''}
        ${p.bio ? `<dt>${t('tree.field.description', 'Description')}</dt><dd>${p.bio}</dd>` : ''}
      </dl>
      ${photos ? `<dt style="font-size:12px;font-weight:600;color:#8a6a58;margin-top:14px;">${t('tree.field.photos', 'Photos')}</dt><div class="photos">${photos}</div>` : ''}
      ${audioList.length ? `<dt style="font-size:12px;font-weight:600;color:#8a6a58;margin-top:14px;">${t('tree.field.voicemessage', 'Voice message')}</dt>${audioList.map(src => `<audio controls src="${src}" style="width:100%; margin-top:6px;"></audio>`).join('')}` : ''}
      ${(p.locations || []).length ? `<p style="margin-top:22px;"><a class="btn btn-outline-dark btn-sm" href="map.html?person=${p.id}">${t('tree.field.journey', "See their journey")}</a></p>` : ''}
    `;
    panel.classList.add('open');
    currentPanelPersonId = p.id;
  }

  // ---------- Downloads ----------
  async function exportTreeAsImage() {
    const btn = document.getElementById('download-image-btn');
    const originalLabel = btn.textContent;
    btn.textContent = 'Preparing…'; btn.disabled = true;
    try {
      const svgEl = document.getElementById('tree-svg');
      const clone = svgEl.cloneNode(true);
      // Inline every element's resolved (computed) style so the exported
      // SVG carries its own colors/filters/fonts instead of relying on the
      // page's stylesheet, which won't exist once this is a standalone file.
      const props = ['fill', 'stroke', 'stroke-width', 'stroke-opacity', 'font-family', 'font-size', 'font-weight', 'opacity', 'filter', 'paint-order', 'stroke-linejoin', 'text-anchor'];
      const originals = svgEl.querySelectorAll('*');
      const clones = clone.querySelectorAll('*');
      originals.forEach((orig, i) => {
        const cs = getComputedStyle(orig);
        let styleStr = '';
        props.forEach(p => { const v = cs.getPropertyValue(p); if (v && v !== 'none') styleStr += `${p}:${v};`; });
        if (styleStr) clones[i].setAttribute('style', styleStr);
      });
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('width', totalWidth); bg.setAttribute('height', totalHeight);
      bg.setAttribute('fill', '#FBF2E3');
      clone.insertBefore(bg, clone.firstChild);
      clone.setAttribute('width', totalWidth); clone.setAttribute('height', totalHeight);

      const svgData = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const scale = 2; // export at 2x for a crisp, legible image at full tree size
        const c = document.createElement('canvas');
        c.width = totalWidth * scale; c.height = totalHeight * scale;
        const ctx = c.getContext('2d');
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, totalWidth, totalHeight);
        URL.revokeObjectURL(url);
        c.toBlob((blob) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'pandey-family-tree.png';
          a.click();
          btn.textContent = originalLabel; btn.disabled = false;
        }, 'image/png');
      };
      img.onerror = () => { btn.textContent = originalLabel; btn.disabled = false; alert('Could not generate the image — try again.'); };
      img.src = url;
    } catch (e) {
      btn.textContent = originalLabel; btn.disabled = false;
      alert('Could not generate the image: ' + e.message);
    }
  }
  document.getElementById('download-image-btn').addEventListener('click', exportTreeAsImage);

  // ---------- Search ----------
  document.getElementById('download-pdf-btn').addEventListener('click', () => {
    // Fit the whole tree width into one page's width before printing,
    // so pages only ever stack vertically — never split awkwardly left/right
    // the way default print pagination does with very wide content.
    const A4_LANDSCAPE_USABLE_PX = 1050; // ~297mm landscape minus 8mm margins, at 96 CSS px/in
    const printScale = Math.min(1, A4_LANDSCAPE_USABLE_PX / totalWidth);
    const prevTransform = canvas.style.transform;
    const prevSizerW = sizer.style.width, prevSizerH = sizer.style.height;
    canvas.style.transform = `scale(${printScale})`;
    sizer.style.width = 'auto'; sizer.style.height = 'auto';
    window.print();
    // restore the on-screen zoom afterwards (most browsers fire afterprint;
    // a short fallback timeout covers the ones that don't for the print
    // dialog itself, e.g. some in-app browsers)
    const restore = () => { canvas.style.transform = prevTransform; sizer.style.width = prevSizerW; sizer.style.height = prevSizerH; };
    window.addEventListener('afterprint', restore, { once: true });
    setTimeout(restore, 2000);
  });

  document.getElementById('search-box').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    nodeSel.classed('highlight', false).classed('dim', false);
    linkSel.classed('dim', false);
    if (!q) return;
    const chainOf = (p) => PandeyData.ancestorChain(people, p.id);
    const matchPerson = people.find(p => !p.unnamedPlaceholder && (p.name || '').toLowerCase().includes(q) && chainOf(p)[0] && chainOf(p)[0].id === rootPerson.id);
    if (!matchPerson) return;
    // open up any collapsed branch that hides the match
    const chainIds = chainOf(matchPerson).map(n => n.id);
    let changed = false;
    chainIds.slice(0, -1).forEach(id => { if (collapsed.delete(id)) changed = true; });
    if (changed) draw();
    const ancestorIds = new Set(chainIds);
    nodeSel.classed('dim', d => !ancestorIds.has(d.data.id));
    linkSel.classed('dim', d => !ancestorIds.has(d.target.data.id));
    const matchEl = nodeSel.filter(d => d.data.id === matchPerson.id).classed('highlight', true).node();
    if (matchEl && matchEl.scrollIntoView) matchEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  });

  // ---------- Re-render language-dependent text when the toggle is clicked ----------
  // (the Shri/Smt prefixes and placeholder labels on already-drawn SVG nodes,
  // plus the open detail panel and sidebar, don't update on their own since
  // they were built once at load time)
  window.addEventListener('pandey-lang-changed', () => {
    draw();
    document.getElementById('search-box').setAttribute('placeholder', PandeyI18n.t('tree.search.placeholder', 'Search a name…'));
    document.getElementById('download-pdf-btn').textContent = PandeyI18n.t('tree.download.pdf', 'Download as PDF');
    if (currentPanelPersonId) {
      const p = people.find(x => x.id === currentPanelPersonId);
      if (p) openPanel(p);
    }
  });
})();
</script>
</body>
</html>
