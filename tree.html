<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree — The Pandey Clan of Bairati</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  .tree-toolbar {
    background: var(--paper-light);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    position: sticky; top: 0; z-index: 6;
  }
  .tree-toolbar .wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .tree-toolbar input[type=search] { max-width: 300px; }
  .legend { font-size: 13px; color: #8a6a58; display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .tree-body {
    display: grid;
    grid-template-columns: 1fr 280px;
    align-items: start;
  }
  .story-sidebar {
    position: sticky;
    top: 64px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    padding: 28px 22px;
    border-left: 1px solid var(--line);
    background: var(--paper-light);
  }
  .story-sidebar .gen-num { font-family: var(--font-display); font-size: 13px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
  .story-sidebar h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0 0 12px; }
  .story-sidebar p { font-size: 14.5px; color: #5a3a2e; line-height: 1.6; }
  .story-sidebar .empty { color: #a3826f; font-style: italic; font-size: 14px; }
  .story-sidebar .story-photos { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .story-sidebar .story-photos img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

  .tree-scroll-wrap {
    overflow-x: auto;
    background-image: url('assets/img/ING_3479.JPEG');
    background-repeat: repeat;
    background-size: 620px auto;
    background-color: var(--paper);
  }
  .tree-canvas { position: relative; }

  .gen-marker { position: absolute; left: 0; width: 100%; pointer-events: none; }
  .gen-label-tag {
    position: absolute; left: 14px;
    font-family: var(--font-display); font-size: 12.5px; font-weight: 600;
    color: var(--ochre); opacity: 0.55; letter-spacing: 0.3px;
  }

  .link { fill: none; stroke: var(--line-dark); stroke-opacity: 0.5; stroke-width: 1.4px; }
  .link.dim { stroke-opacity: 0.1; }

  .node circle.avatar-ring { stroke-width: 2px; cursor: pointer; transition: stroke-width .12s; }
  .node image { cursor: pointer; }
  .node:hover circle.avatar-ring { stroke-width: 3.5px; }
  .node text { font-family: var(--font-body); font-size: 11px; fill: var(--ink); cursor: pointer; text-anchor: middle; }
  .node.placeholder text { fill: #a3826f; font-style: italic; }
  .node.dim { opacity: 0.15; }
  .node.highlight circle.avatar-ring { stroke: var(--gold) !important; stroke-width: 4px; }

  .root-node circle.avatar-ring { stroke: var(--gold); stroke-width: 3px; }
  .root-node text { font-family: var(--font-display); font-weight: 600; font-size: 13px; fill: var(--maroon-deep); }

  .panel {
    position: fixed; top: 0; right: 0; width: 340px; max-width: 88vw; height: 100%;
    background: var(--paper-light); border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(60,20,15,0.12); padding: 24px; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s ease; z-index: 20;
  }
  .panel.open { transform: translateX(0); }
  .panel .close-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink); }
  .panel .avatar-lg { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin-bottom: 14px; }
  .panel .avatar-lg-placeholder { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 14px; background: var(--ochre); opacity: 0.25; }
  .panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 4px 0 6px; }
  .panel .chain { font-size: 13px; color: #8a6a58; margin-bottom: 18px; }
  .panel dl { margin: 0; }
  .panel dt { font-size: 12px; font-weight: 600; color: #8a6a58; margin-top: 14px; }
  .panel dd { margin: 3px 0 0; }
  .panel .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .panel .photos img { width: 70px; height: 70px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }

  @media (max-width: 800px) {
    .tree-body { grid-template-columns: 1fr; }
    .story-sidebar { position: static; height: auto; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">The Pandey Clan <em>of Bairati</em></a>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
    <ul class="links">
      <li><a href="index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="tree.html" class="active" data-i18n="nav.tree">Family Tree</a></li>
      <li><a href="map.html" data-i18n="nav.map">Journeys Map</a></li>
      <li><a href="village.html" data-i18n="nav.village">Bairati Village</a></li>
      <li><a href="archive.html" data-i18n="nav.archive">Archive</a></li>
      <li><a href="audit.html" data-i18n="nav.audit">Changelog</a></li>
      <li><a href="admin.html" data-i18n="nav.admin">Edit</a></li>
      <li><button class="lang-toggle" id="lang-toggle">हिंदी</button></li>
    </ul>
  </div>
</nav>

<div class="tree-toolbar">
  <div class="wrap">
    <input type="search" id="search-box" placeholder="Search a name…" aria-label="Search the family tree" data-i18n-placeholder="tree.search.placeholder">
    <span class="legend">
      <span><i style="background:var(--maroon)"></i> <span data-i18n="tree.legend.named">named</span></span>
      <span><i style="background:#E7C9A8"></i> <span data-i18n="tree.legend.placeholder">unnamed / placeholder</span></span>
      <span><i style="background:var(--gold);"></i> has a photo</span>
    </span>
  </div>
</div>

<div class="tree-body">
  <div class="tree-scroll-wrap" id="tree-scroll-wrap">
    <div class="tree-canvas" id="tree-canvas">
      <svg id="tree-svg"></svg>
    </div>
  </div>

  <aside class="story-sidebar" id="story-sidebar">
    <p class="muted" style="font-size:13.5px;">Scroll down through the tree — this panel follows along with a bit about each generation.</p>
  </aside>
</div>

<aside class="panel" id="panel">
  <button class="close-btn" id="panel-close" aria-label="Close">&times;</button>
  <div id="panel-body"></div>
</aside>

<script src="js/common.js"></script>
<script src="js/i18n.js"></script>
<script>
(async function () {
  let people, generations;
  try {
    [people, generations] = await Promise.all([
      PandeyData.loadPeople(),
      fetch('data/generations.json?_=' + Date.now()).then(r => r.json()).catch(() => [])
    ]);
  } catch (e) {
    showFatalError('Could not load the family tree: ' + e.message);
    return;
  }
  const genById = {};
  generations.forEach(g => { genById[g.generation] = g; });

  function buildNode(p) {
    return { id: p.id, data: p, children: people.filter(c => c.parentId === p.id).map(buildNode) };
  }
  const rootPerson = people.find(p => !p.parentId);
  const root = d3.hierarchy(buildNode(rootPerson), d => d.children);
  const maxDepth = d3.max(root.descendants(), d => d.depth);

  const DX = 120;  // horizontal spacing between siblings — wide enough for bigger avatars + labels
  const DY = 168;  // vertical spacing between generations
  const MARGIN_TOP = 60, MARGIN_SIDE = 60;

  const treeLayout = d3.tree().nodeSize([DX, DY]);
  treeLayout(root);

  let minX = Infinity, maxX = -Infinity;
  root.each(d => { minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x); });
  const totalWidth = (maxX - minX) + MARGIN_SIDE * 2;
  const totalHeight = maxDepth * DY + MARGIN_TOP * 2;
  const offsetX = -minX + MARGIN_SIDE;

  const canvas = document.getElementById('tree-canvas');
  canvas.style.width = totalWidth + 'px';
  canvas.style.height = totalHeight + 'px';

  // Bring the root into view immediately instead of leaving the scroll
  // position at the canvas's default left edge, which — since the tree
  // spreads roughly symmetrically from the root — could otherwise leave
  // Sukhdev off-screen to the right on first load.
  const scrollWrap = document.getElementById('tree-scroll-wrap');
  requestAnimationFrame(() => { scrollWrap.scrollLeft = Math.max(0, offsetX - 60); });

  const svg = d3.select('#tree-svg').attr('width', totalWidth).attr('height', totalHeight);
  const g = svg.append('g').attr('transform', `translate(${offsetX},${MARGIN_TOP})`);

  // ---------- Generation row labels + scroll-observer markers ----------
  for (let gen = 1; gen <= maxDepth + 1; gen++) {
    const y = (gen - 1) * DY + MARGIN_TOP;
    const marker = document.createElement('div');
    marker.className = 'gen-marker';
    marker.dataset.gen = gen;
    marker.style.top = y + 'px';
    marker.style.height = DY + 'px';
    canvas.appendChild(marker);

    const tag = document.createElement('div');
    tag.className = 'gen-label-tag';
    tag.style.top = (y + 6) + 'px';
    tag.textContent = (genById[gen] && genById[gen].title) || `Generation ${gen}`;
    canvas.appendChild(tag);
  }

  // ---------- Links ----------
  const linkGen = d3.linkVertical().x(d => d.x).y(d => d.y);
  const linkSel = g.append('g').attr('class', 'links-layer')
    .selectAll('path.link').data(root.links()).join('path').attr('class', 'link').attr('d', linkGen);

  // ---------- Nodes ----------
  const R = 20, ROOT_R = 34;
  const nodeSel = g.append('g').attr('class', 'nodes-layer')
    .selectAll('g.node').data(root.descendants()).join('g')
    .attr('class', d => 'node' + (d.data.data.unnamedPlaceholder ? ' placeholder' : '') + (d.depth === 0 ? ' root-node' : ''))
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeSel.each(function (d) {
    const sel = d3.select(this);
    const p = d.data.data;
    const r = d.depth === 0 ? ROOT_R : R;
    const hasPhoto = p.photos && p.photos.length;
    const ringColor = p.unnamedPlaceholder ? '#C9A98A' : (hasPhoto ? 'var(--gold)' : 'var(--maroon)');

    if (hasPhoto) {
      const clipId = 'clip-' + d.data.id;
      sel.append('clipPath').attr('id', clipId).append('circle').attr('r', r);
      sel.append('image').attr('href', p.photos[0])
        .attr('x', -r).attr('y', -r).attr('width', r * 2).attr('height', r * 2)
        .attr('clip-path', `url(#${clipId})`).attr('preserveAspectRatio', 'xMidYMid slice');
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r).attr('fill', 'none').attr('stroke', ringColor);
    } else {
      sel.append('circle').attr('class', 'avatar-ring').attr('r', r)
        .attr('fill', d.depth === 0 ? 'var(--maroon)' : '#FFFBF3').attr('stroke', ringColor);
    }

    sel.append('text').text(PandeyData.displayName(p)).attr('y', r + 15);
  });

  nodeSel.on('click', (event, d) => { event.stopPropagation(); openPanel(d.data.data); });

  // ---------- Sticky generation story, driven by scroll position ----------
  const sidebar = document.getElementById('story-sidebar');
  function renderStory(gen) {
    const story = genById[gen];
    const photos = story && story.photos && story.photos.length
      ? `<div class="story-photos">${story.photos.map(src => `<img src="${src}">`).join('')}</div>` : '';
    sidebar.innerHTML = `
      <div class="gen-num">GENERATION ${gen}</div>
      <h2>${(story && story.title) || 'Generation ' + gen}</h2>
      ${photos}
      ${story && story.description ? `<p>${story.description}</p>` : `<p class="empty">No story added for this generation yet.</p>`}
      <a class="btn btn-outline-dark btn-sm" href="admin.html?generation=${gen}">Add to this generation's story</a>
    `;
  }
  renderStory(1);

  const markers = document.querySelectorAll('.gen-marker');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) renderStory(parseInt(entry.target.dataset.gen, 10)); });
  }, { root: null, rootMargin: '-42% 0px -42% 0px', threshold: 0 });
  markers.forEach(m => observer.observe(m));

  // ---------- Detail panel ----------
  const panel = document.getElementById('panel');
  const panelBody = document.getElementById('panel-body');
  document.getElementById('panel-close').addEventListener('click', () => panel.classList.remove('open'));

  function openPanel(p) {
    const chain = PandeyData.ancestorChain(people, p.id).map(n => PandeyData.displayName(n)).join(' → ');
    const photos = (p.photos || []).map(src => `<img src="${src}" alt="">`).join('');
    const avatarHtml = (p.photos && p.photos.length) ? `<img class="avatar-lg" src="${p.photos[0]}" alt="">` : `<div class="avatar-lg-placeholder"></div>`;
    const current = (p.locations || []).find(l => l.type === 'current');
    const others = (p.locations || []).filter(l => l.type !== 'current' && l.type !== 'origin');
    const othersStr = others.map(l => `${l.place}${l.year ? ' (' + l.year + ')' : ''}`).join(', ');
    panelBody.innerHTML = `
      ${avatarHtml}
      <h2>${PandeyData.displayName(p)}</h2>
      <div class="chain">${chain}</div>
      ${p.unnamedPlaceholder ? '<span class="badge badge-placeholder">Name not recorded</span>' : ''}
      <dl>
        ${p.fullName ? `<dt>Full name</dt><dd>${p.fullName}</dd>` : ''}
        ${p.occupation ? `<dt>Occupation</dt><dd>${p.occupation}</dd>` : ''}
        ${p.birthYear ? `<dt>Born</dt><dd>${p.birthYear}</dd>` : ''}
        ${current ? `<dt>Current location</dt><dd>${current.place}</dd>` : ''}
        ${othersStr ? `<dt>Places visited</dt><dd>${othersStr}</dd>` : ''}
        ${p.bio ? `<dt>Description</dt><dd>${p.bio}</dd>` : ''}
        ${p.notes ? `<dt>Note</dt><dd class="muted">${p.notes}</dd>` : ''}
      </dl>
      ${photos ? `<dt style="font-size:12px;font-weight:600;color:#8a6a58;margin-top:14px;">Photos</dt><div class="photos">${photos}</div>` : ''}
      <p style="margin-top:22px; display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn btn-outline-dark btn-sm" href="admin.html?person=${p.id}">Add details</a>
        ${(p.locations || []).length ? `<a class="btn btn-outline-dark btn-sm" href="map.html?person=${p.id}">See their journey</a>` : ''}
      </p>
    `;
    panel.classList.add('open');
  }

  // ---------- Search ----------
  document.getElementById('search-box').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    nodeSel.classed('highlight', false).classed('dim', false);
    linkSel.classed('dim', false);
    if (!q) return;

    const match = root.descendants().find(d => !d.data.data.unnamedPlaceholder && d.data.data.name.toLowerCase().includes(q));
    if (!match) return;

    const ancestorIds = new Set();
    let n = match;
    while (n) { ancestorIds.add(n.data.id); n = n.parent; }
    nodeSel.classed('dim', d => !ancestorIds.has(d.data.id));
    linkSel.classed('dim', d => !ancestorIds.has(d.target.data.id));
    const matchEl = nodeSel.filter(d => d.data.id === match.data.id).classed('highlight', true).node();
    if (matchEl && matchEl.scrollIntoView) matchEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  });
})();
</script>
</body>
</html>
